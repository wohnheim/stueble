[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "cryptography>=46.0.5",
    "dotenv>=0.9.9",
    "flask>=3.1.3",
    "google-api-python-client>=2.193.0",
    "msgpack>=1.1.2",
    "pillow>=12.1.1",
    "psycopg[binary,pool]>=3.3.3",
    "pytz>=2025.2",
    "pyzbar>=0.1.9",
    "qrcode>=8.2",
    "requests>=2.32.5",
    "waitress>=3.0.2",
    "websockets>=16.0",
]

[project.scripts]
backend = "backend.main:main"

[build-system]
requires = ["hatchling", "editables"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/backend"]

[tool.hatch.build.targets.sdist]
include = ["packages/backend"]

[tool.basedpyright]
extraPaths = ["packages"]
